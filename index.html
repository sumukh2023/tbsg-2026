<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ICONS. `favicon.ico` is the one that must exist as a FILE: Safari
         asks the site root for it whatever this document declares, and a
         missing one here does not 404 — vercel.json's SPA catch-all answers
         with index.html at HTTP 200, and a browser handed HTML where it asked
         for an image draws a blank white square. Everything else is a
         preference: SVG first for the browsers that take it, a PNG behind it,
         an opaque apple-touch-icon because iOS composites transparency on
         black, and a monochrome mask for Safari's pinned tabs.
         All of them are generated from the seagull in CarnivalMark.tsx by
         `node scripts/make-favicons.mjs`. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#2B6686" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Flash @ Brigade 2026: Namma Mia Carpisa. The Brigade School @ Malleswaram becomes an Italian piazza for one day, 14 November 2026. A student-run carnival raising funds for children's education and healthcare."
    />
    <meta name="theme-color" content="#F6F2EB" />

    <!-- Open Graph -->
    <meta property="og:title" content="Flash @ Brigade 2026 · Namma Mia Carpisa" />
    <meta
      property="og:description"
      content="One school. One day. An Italian piazza. The Brigade School @ Malleswaram, 14 November 2026."
    />
    <meta property="og:type" content="website" />

    <!-- Hero typography: Inter via Google Fonts (Cormorant/Montserrat remain
         self-hosted via @fontsource, imported in src/main.tsx). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Flash @ Brigade 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
