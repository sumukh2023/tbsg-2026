<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film diagnostic · Flash @ Brigade</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #101916;
        color: #e9e5dd;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.lede {
        margin: 0 0 16px;
        color: #9fb0a8;
      }
      section {
        border: 1px solid #26332e;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 8px;
        color: #c9a24a;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .row {
        display: flex;
        gap: 10px;
        border-bottom: 1px solid #1b2621;
        padding: 3px 0;
        word-break: break-all;
      }
      .row span:first-child {
        color: #8ea79c;
        flex: 0 0 40%;
      }
      .ok {
        color: #7fd1a4;
      }
      .bad {
        color: #ff8a7a;
      }
      .warn {
        color: #ffcf70;
      }
      button {
        font: inherit;
        background: #c9502f;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        margin-bottom: 16px;
      }
      video {
        width: 160px;
        height: 90px;
        object-fit: cover;
        background: #000;
        border: 1px solid #26332e;
      }
      #out {
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Film diagnostic</h1>
    <p class="lede">
      Runs the same video setup the site uses and reports what the browser
      actually does with it. Wait for it to finish, then tap Copy and paste the
      result back.
    </p>
    <button id="gesture">Tap here to test playback (do this first)</button>
    <button id="copy">Copy report</button>
    <div id="panels"></div>
    <pre id="out"></pre>

    <script>
      const lines = [];
      const panels = document.getElementById('panels');

      function section(title) {
        const el = document.createElement('section');
        el.innerHTML = '<h2>' + title + '</h2>';
        panels.appendChild(el);
        lines.push('', '## ' + title);
        return el;
      }
      function row(host, key, value, state) {
        const div = document.createElement('div');
        div.className = 'row';
        const k = document.createElement('span');
        k.textContent = key;
        const v = document.createElement('span');
        v.textContent = String(value);
        if (state) v.className = state;
        div.append(k, v);
        host.appendChild(div);
        lines.push(key + ': ' + value);
      }

      // ---------------------------------------------------------------
      // 1. Environment
      // ---------------------------------------------------------------
      const env = section('Environment');
      const mq = (q) => window.matchMedia(q).matches;
      row(env, 'userAgent', navigator.userAgent);
      row(env, 'vendor', navigator.vendor);
      row(env, 'platform', navigator.platform);
      row(env, 'viewport', innerWidth + ' x ' + innerHeight);
      row(env, 'devicePixelRatio', devicePixelRatio);
      row(env, 'pointer: coarse', mq('(pointer: coarse)'));
      row(
        env,
        'prefers-reduced-motion',
        mq('(prefers-reduced-motion: reduce)'),
        mq('(prefers-reduced-motion: reduce)') ? 'warn' : 'ok'
      );
      row(env, 'prefers-reduced-data', mq('(prefers-reduced-data: reduce)'));
      row(env, 'max-width: 767px', mq('(max-width: 767px)'));
      row(env, 'deviceMemory', navigator.deviceMemory ?? 'n/a');
      row(env, 'hardwareConcurrency', navigator.hardwareConcurrency ?? 'n/a');
      row(
        env,
        'connection',
        navigator.connection
          ? navigator.connection.effectiveType +
              (navigator.connection.saveData ? ' saveData:ON' : '')
          : 'n/a'
      );

      // ---------------------------------------------------------------
      // 2. Codec support
      // ---------------------------------------------------------------
      const codec = section('Codec support');
      const probeEl = document.createElement('video');
      const can = (t) => probeEl.canPlayType(t) || 'no';
      row(codec, 'H.264 (mp4)', can('video/mp4; codecs="avc1.42E01E"'), null);
      row(codec, 'mp4 generic', can('video/mp4'));
      row(codec, 'VP9 (webm)', can('video/webm; codecs="vp9"'));
      row(codec, 'webm generic', can('video/webm'));
      row(codec, 'fastSeek available', typeof probeEl.fastSeek === 'function');

      // ---------------------------------------------------------------
      // 3. Can the files actually be fetched, with byte ranges?
      // ---------------------------------------------------------------
      const net = section('Media files (range request)');
      const FILES = [
        '/hero.mp4',
        '/hero.webm',
        '/hero-mobile.mp4',
        '/ground.mp4',
        '/ground.webm',
      ];
      async function checkFile(path) {
        try {
          const res = await fetch(path, { headers: { Range: 'bytes=0-1023' } });
          const ok = res.status === 206 || res.status === 200;
          row(
            net,
            path,
            res.status +
              ' ' +
              (res.headers.get('content-type') || '?') +
              ' len=' +
              (res.headers.get('content-length') || '?') +
              ' ranges=' +
              (res.headers.get('accept-ranges') || 'none'),
            ok ? 'ok' : 'bad'
          );
        } catch (e) {
          row(net, path, 'FETCH FAILED: ' + e.name + ' ' + e.message, 'bad');
        }
      }

      // ---------------------------------------------------------------
      // 4. The real test: build the element exactly as the site does and
      //    watch what the decoder does with it.
      // ---------------------------------------------------------------
      const NET_STATE = ['EMPTY', 'IDLE', 'LOADING', 'NO_SOURCE'];
      const ERR = [
        '',
        'ABORTED',
        'NETWORK',
        'DECODE',
        'SRC_NOT_SUPPORTED (no playable source)',
      ];

      async function testFilm(label, mp4, webm) {
        const host = section(label);
        const v = document.createElement('video');
        v.muted = true;
        v.playsInline = true;
        v.preload = 'metadata';
        v.disableRemotePlayback = true;
        v.setAttribute('webkit-playsinline', '');
        const s1 = document.createElement('source');
        s1.src = mp4;
        s1.type = 'video/mp4';
        const s2 = document.createElement('source');
        s2.src = webm;
        s2.type = 'video/webm';
        v.append(s1, s2);
        host.appendChild(v);

        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        await wait(1200);

        // Same escalation the site performs when the section approaches.
        v.preload = 'auto';
        let playResult = 'not attempted';
        try {
          const p = v.play();
          if (p && p.then) {
            await p;
            playResult = 'RESOLVED (autoplay allowed)';
          } else playResult = 'no promise returned';
          v.pause();
        } catch (e) {
          playResult = 'REJECTED: ' + e.name + ' — ' + e.message;
        }
        await wait(2500);

        // Force a decoded frame the way the site does.
        try {
          v.currentTime = 0.001;
        } catch (e) {
          row(host, 'seek threw', e.name + ' ' + e.message, 'bad');
        }
        await wait(1500);

        // Safari can decline to start resource selection on its own. An
        // explicit load() is the only way to tell "would not start" apart
        // from "started and failed".
        const beforeLoad = v.networkState + '/' + v.readyState;
        try {
          v.load();
        } catch (e) {
          row(host, 'load() threw', e.name + ' ' + e.message, 'bad');
        }
        await wait(2500);
        row(
          host,
          'explicit load()',
          'networkState/readyState ' + beforeLoad + ' -> ' + v.networkState + '/' + v.readyState,
          v.readyState >= 2 ? 'ok' : 'bad'
        );

        const buffered = [];
        for (let i = 0; i < v.buffered.length; i++) {
          buffered.push(
            v.buffered.start(i).toFixed(2) + '-' + v.buffered.end(i).toFixed(2)
          );
        }
        row(host, 'currentSrc', v.currentSrc || '(none chosen)', v.currentSrc ? 'ok' : 'bad');
        row(
          host,
          'readyState',
          v.readyState + (v.readyState >= 2 ? ' (has a frame)' : ' (NO FRAME)'),
          v.readyState >= 2 ? 'ok' : 'bad'
        );
        row(host, 'networkState', v.networkState + ' ' + NET_STATE[v.networkState]);
        row(
          host,
          'error',
          v.error ? v.error.code + ' ' + ERR[v.error.code] + ' — ' + (v.error.message || '') : 'none',
          v.error ? 'bad' : 'ok'
        );
        row(host, 'videoWidth x Height', v.videoWidth + ' x ' + v.videoHeight,
            v.videoWidth ? 'ok' : 'bad');
        row(host, 'duration', isFinite(v.duration) ? v.duration.toFixed(2) + 's' : 'unknown',
            isFinite(v.duration) ? 'ok' : 'bad');
        row(host, 'currentTime', v.currentTime.toFixed(3));
        row(host, 'buffered', buffered.join(', ') || '(nothing buffered)',
            buffered.length ? 'ok' : 'bad');
        row(host, 'play() result', playResult,
            playResult.startsWith('RESOLVED') ? 'ok' : 'warn');
        row(host, 'paused', v.paused);
      }

      (async () => {
        for (const f of FILES) await checkFile(f);
        await testFilm('Hero film', '/hero.mp4', '/hero.webm');
        await testFilm('Ground film', '/ground.mp4', '/ground.webm');
        const done = section('Done');
        row(done, 'finished at', new Date().toISOString());
        document.getElementById('out').textContent = lines.join('\n');
      })();

      document.getElementById('gesture').addEventListener('click', async () => {
        const btn = document.getElementById('gesture');
        btn.textContent = 'Testing under your tap...';
        const host = section('Playback under a real user tap');
        const v = document.createElement('video');
        v.muted = true;
        v.playsInline = true;
        v.setAttribute('webkit-playsinline', '');
        v.preload = 'auto';
        const g1 = document.createElement('source');
        g1.src = '/hero.mp4';
        g1.type = 'video/mp4';
        const g2 = document.createElement('source');
        g2.src = '/hero.webm';
        g2.type = 'video/webm';
        v.append(g1, g2);
        host.appendChild(v);
        let result = '';
        try {
          v.load();
          // play() can hang rather than settle when nothing is loadable, so
          // the wait is bounded: a stuck promise is itself a finding.
          result = await Promise.race([
            v.play().then(() => 'PLAYED (a tap lifts the block)'),
            new Promise((r) =>
              setTimeout(() => r('NO ANSWER: play() never settled in 8s'), 8000)
            ),
          ]);
        } catch (e) {
          result = 'STILL REFUSED: ' + e.name + ' — ' + e.message;
        }
        await new Promise((r) => setTimeout(r, 2500));
        row(host, 'with user gesture', result,
            result.startsWith('PLAYED') ? 'ok' : 'bad');
        row(host, 'readyState', v.readyState, v.readyState >= 2 ? 'ok' : 'bad');
        row(host, 'networkState', v.networkState);
        row(host, 'currentSrc', v.currentSrc || '(none chosen)',
            v.currentSrc ? 'ok' : 'bad');
        row(host, 'currentTime', v.currentTime.toFixed(2));
        v.pause();
        btn.textContent = 'Tap test done — now Copy report';
        document.getElementById('out').textContent = lines.join('\n');
      });

      document.getElementById('copy').addEventListener('click', async () => {
        const text = lines.join('\n');
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById('copy').textContent = 'Copied';
        } catch {
          const out = document.getElementById('out');
          out.style.display = 'block';
          document.getElementById('copy').textContent =
            'Select the text below and copy';
        }
      });
    </script>
  </body>
</html>
